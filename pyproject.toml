[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-graph-model"
version = "0.2.0"
description = "DeltaGraphModel (DGM): A modular, process-emergent generative graph framework for synthetic river delta channel networks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Delta Graph Model Contributors" }
]
keywords = [
    "delta",
    "distributary-networks",
    "graph-generation",
    "hydraulics",
    "murrays-law",
    "geomorphology",
    "topological-networks",
    "ensembles"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jay-kestrel/dgm"
Repository = "https://github.com/jay-kestrel/dgm"
Issues = "https://github.com/jay-kestrel/dgm/issues"
Documentation = "https://jay-kestrel.github.io/dgm/"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
benchmarks = [
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
all = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]

[project.scripts]
dgm = "dgm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgm = ["*.yaml", "config/*.yaml", "data/*.json"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]  # examples bootstrap sys.path before importing dgm
