[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-graph-model"
version = "0.2.0"
description = "DeltaGraphModel (DGM): A modular, process-emergent generative graph framework for synthetic river delta channel networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Delta Graph Model Contributors" }
]
keywords = [
    "delta",
    "distributary-networks",
    "graph-generation",
    "hydraulics",
    "murrays-law",
    "geomorphology",
    "topological-networks",
    "ensembles"
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
dgm = "dgm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
