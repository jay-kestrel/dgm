name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run test suite with pytest
        run: uv run --extra dev pytest tests -v

      - name: Smoke test CLI generate
        run: uv run dgm generate -N 25 -R 0.4 -s 42

      - name: Smoke test CLI ensemble
        run: uv run dgm ensemble -N 20 -R 0.5 -n 3 -s 42

      - name: Smoke test example scripts
        run: |
          uv run python examples/01_single_realization.py
          uv run python examples/03_compare_river_vs_tide.py

      - name: Build sdist and wheel
        run: uv build

      - name: Test installing built wheel
        run: uv pip install --system dist/*.whl
